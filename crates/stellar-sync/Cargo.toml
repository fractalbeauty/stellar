[package]
name = "stellar-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
stellar-graph = { path = "../stellar-graph" }
stellar-riblt = { path = "../stellar-riblt" }
stellar-uniffi = { path = "../stellar-uniffi" }

sorrel-client = { git = "https://github.com/fractalbeauty/sorrel", rev = "f032ec80d9320491e3547202256df1ace6f92357" }

anyhow = "1.0.103"
arc-swap = "1.9.1"
futures = "0.3.32"
iroh = "1.0.0"
reqwest = { version = "0.13.4", features = ["rustls"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
siphasher = "1.0.3"
tokio = { version = "1.52.3", default-features = false, features = ["time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.23.3"
automerge = "0.7.4"
automorph = "0.2.0"
pin-project-lite = "0.2.17"
async-trait = "0.1.92"
serde_json = "1.0.151"
uniffi = "0.29.4"

[dev-dependencies]
hegeltest = "0.23.3"
testdir = "0.10.0"
tracing-subscriber = "0.3.23"

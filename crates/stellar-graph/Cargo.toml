[package]
name = "stellar-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
stellar-uniffi = { path = "../stellar-uniffi" }

anyhow = "1.0.103"
automerge = "0.7.4"
automorph = { version = "0.2.0", features = ["uuid"] }
fjall = "3.1.5"
hegeltest = "0.23.3"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
uniffi = "0.29.4"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
rand = "0.10.2"
ordered-float = { version = "5.5.0", features = ["serde"] }

[dev-dependencies]
criterion = "0.8.2"
testdir = "0.10.0"

[[bench]]
name = "table_query"
harness = false

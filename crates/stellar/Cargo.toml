[package]
name = "stellar"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "stellar"

[dependencies]
stellar-graph = { path = "../stellar-graph" }
stellar-log = { path = "../stellar-log" }
stellar-sync = { path = "../stellar-sync" }
stellar-uniffi = { path = "../stellar-uniffi" }

anyhow = "1.0.103"
async-std = "1.13.2"
directories-next = "2.0.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.44"
uniffi = "0.29.4"
tokio-util = "0.7.18"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
